<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>okslollo | Official Hub</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --tiktok: #fe2c55; 
            --instagram: #E1306C; 
            --dark-bg: #0f0f0f; 
        }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: var(--dark-bg); 
            color: white; 
            margin: 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header & Profilo */
        header { 
            padding: 50px 20px; 
            text-align: center; 
            width: 100%;
            background: linear-gradient(180deg, #000 0%, var(--dark-bg) 100%);
        }

        .profile-img { 
            width: 130px; 
            height: 130px; 
            border-radius: 50%; 
            border: 4px solid var(--tiktok); 
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(254, 44, 85, 0.3);
        }

        h1 { margin: 10px 0; font-size: 2.5rem; letter-spacing: -1px; }
        .bio { color: #bbb; max-width: 500px; margin: 0 auto 30px; font-size: 1.1rem; }
