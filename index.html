    <style>
        :root { 
            --tiktok: #fe2c55; 
            --instagram: #E1306C; 
            --discord: #5865F2; 
            --dark-bg: #0f0f0f; 
        }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: var(--dark-bg); 
            color: white; 
            margin: 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header & Profilo */
        header { 
            padding: 50px 20px; 
            text-align: center; 
            width: 100%;
            background: linear-gradient(180deg, #000 0%, var(--dark-bg) 100%);
        }

        .profile-img { 
            width: 130px; 
            height: 130px; 
            border-radius: 50%; 
            border: 4px solid var(--tiktok); 
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(254, 44, 85, 0.3);
        }

        h1 { margin: 10px 0; font-size: 2.5rem; letter-spacing: -1px; }
        .bio { color: #bbb; max-width: 500px; margin: 0 auto 30px; font-size: 1.1rem; }

        /* --- SEZIONE SOCIAL --- */
        .social-grid {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .social-link {
            text-decoration: none;
            color: white;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            min-width: 140px;
            justify-content: center;
        }

        .social-link:hover { transform: translateY(-5px); filter: brightness(1.2); }
        
        .tk { background: var(--tiktok); }
        .ig { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .dc { background: var(--discord); }

        /* --- VIDEO GRID --- */
        .feed-container { padding: 40px 20px; width: 100%; max-width: 1200px; box-sizing: border-box; }
        .video-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 20px; 
            justify-items: center;
        }

        footer { padding: 40px; color: #444; font-size: 0.8rem; }
    </style>
</head>
